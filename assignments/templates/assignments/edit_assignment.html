{% extends 'assignments/base.html' %}

{% block title %}Edit Assignment | StudyFlow{% endblock %}

{% block content %}

<section class="page-container">

    <div class="form-page">

        <div class="form-intro">
            <p class="eyebrow">EDIT ASSIGNMENT</p>
            <h1>Update Your Assignment</h1>
            <p>
                Make changes to your assignment information and save them
                when you are finished.
            </p>
        </div>

        <div class="form-card">

            <form method="POST">
                {% csrf_token %}

                <div class="form-grid">

                    <div class="form-group full-width">
                        <label for="title">Assignment Title</label>
                        <input
                            type="text"
                            id="title"
                            name="title"
                            value="{{ assignment.title }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            value="{{ assignment.subject }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="due_date">Due Date</label>
                        <input
                            type="date"
                            id="due_date"
                            name="due_date"
                            value="{{ assignment.due_date|date:'Y-m-d' }}"
                            required
                        >
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            name="description"
                            rows="6"
                            placeholder="Add details about this assignment..."
                        >{{ assignment.description }}</textarea>
                    </div>

                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority" name="priority" required>
                            <option value="Low" {% if assignment.priority == 'Low' %}selected{% endif %}>Low</option>
                            <option value="Medium" {% if assignment.priority == 'Medium' %}selected{% endif %}>Medium</option>
                            <option value="High" {% if assignment.priority == 'High' %}selected{% endif %}>High</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status" required>
                            <option value="Pending" {% if assignment.status == 'Pending' %}selected{% endif %}>Pending</option>
                            <option value="In Progress" {% if assignment.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                            <option value="Completed" {% if assignment.status == 'Completed' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>

                </div>

                <div class="form-actions">

                    <a
                        href="{% url 'assignment_list' %}"
                        class="btn btn-secondary"
                    >
                        Back to Assignments
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
